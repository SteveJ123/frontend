<div class="min-h-screen bg-gray-50 p-6 md:p-10 font-sans">
  <div class="max-w-7xl mx-auto">
    <!-- Top Header -->
    <header
      class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-6 border-b border-gray-200"
    >
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900">Admin Management Portal</h1>
        <p class="text-sm text-gray-500 mt-1">
          Select a module to manage content or switch target language environment.
        </p>
      </div>

      <!-- Language Toggle Group -->
      <div
        class="inline-flex bg-gray-200 p-1 rounded-lg border border-gray-300 self-start md:self-auto"
      >
        <button
          type="button"
          class="px-4 py-2 text-sm font-semibold rounded-md transition-all duration-200"
          [ngClass]="
            activeLang === 'te'
              ? 'bg-white text-blue-600 shadow-sm'
              : 'text-gray-600 hover:text-gray-900'
          "
          (click)="switchLanguage('te')"
        >
          🇮🇳 Telugu (/te/)
        </button>
        <button
          type="button"
          class="px-4 py-2 text-sm font-semibold rounded-md transition-all duration-200"
          [ngClass]="
            activeLang === 'en'
              ? 'bg-white text-blue-600 shadow-sm'
              : 'text-gray-600 hover:text-gray-900'
          "
          (click)="switchLanguage('en')"
        >
          🇬🇧 English (/en/)
        </button>
      </div>
    </header>

    <!-- Modules Grid -->
    <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">
      <div
        *ngFor="let module of adminModules"
        (click)="navigateToModule(module.route)"
        class="bg-white rounded-xl border border-gray-200 p-6 flex flex-col justify-between cursor-pointer hover:-translate-y-1 hover:shadow-lg hover:border-blue-300 transition-all duration-200 group"
      >
        <div>
          <div class="text-3xl mb-3">{{ module.icon }}</div>
          <h2
            class="text-lg font-semibold text-gray-800 group-hover:text-blue-600 transition-colors"
          >
            {{ module.title }}
          </h2>
          <p class="text-sm text-gray-500 mt-2 line-clamp-2">
            {{ module.description }}
          </p>
        </div>

        <div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between">
          <span
            class="inline-block bg-blue-50 text-blue-700 text-xs font-mono font-medium px-2.5 py-1 rounded"
          >
            /{{ activeLang }}/{{ module.route }}
          </span>
          <span class="text-blue-600 font-bold group-hover:translate-x-1 transition-transform">
            &rarr;
          </span>
        </div>
      </div>
    </main>
  </div>
</div>
