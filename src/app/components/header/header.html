<header
  class="bg-white border-b border-gray-200 sticky top-0 z-40 px-4 py-2.5 flex items-center justify-between shadow-sm"
>
  <div class="flex items-center space-x-3">
    <!-- Mobile Menu Button -->
    <button
      (click)="toggleSidebar()"
      class="lg:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-lg transition"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    </button>

    <!-- Logo -->
    <div class="flex items-center space-x-2">
      <div
        class="bg-black text-white font-bold text-lg px-2 py-0.5 rounded flex items-center tracking-tighter"
      >
        ALH<span class="text-xs ml-1 text-gray-300">HUB</span>
      </div>
      <span class="hidden sm:inline text-xs tracking-widest text-gray-500 font-semibold uppercase"
        >Ageless Lifestyle Hub</span
      >
    </div>
  </div>

  <!-- Center Nav Links -->
  <nav
    class="hidden md:flex items-center space-x-6 lg:space-x-8 text-xs font-semibold uppercase tracking-wider"
  >
    <a href="#" class="flex flex-col items-center text-[#88304E] border-b-2 border-[#88304E] pb-1">
      <span class="text-base mb-0.5">👥</span> COMMUNITY
    </a>
    <a href="#" class="flex flex-col items-center text-gray-500 hover:text-gray-900 pb-1">
      <span class="text-base mb-0.5">📹</span> LIVE SESSIONS
    </a>
    <a href="#" class="flex flex-col items-center text-gray-500 hover:text-gray-900 pb-1">
      <span class="text-base mb-0.5">📖</span> COURSES
    </a>
    <a href="#" class="flex flex-col items-center text-gray-500 hover:text-gray-900 pb-1">
      <span class="text-base mb-0.5">📦</span> LEVEL UP
    </a>
    <a href="#" class="flex flex-col items-center text-gray-500 hover:text-gray-900 pb-1">
      <span class="text-base mb-0.5">🎮</span> QUEST
    </a>
    <a href="#" class="flex flex-col items-center text-gray-500 hover:text-gray-900 pb-1">
      <span class="text-base mb-0.5">💎</span> SPARKS
    </a>
  </nav>

  <!-- Right User Actions -->
  <div class="flex items-center space-x-3">
    <button class="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 10h16M4 14h16M4 18h16"
        />
      </svg>
    </button>

    <!-- Notification Icon with Badge -->
    <div class="relative">
      <button class="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
          />
        </svg>
      </button>
      <span
        class="absolute top-1 right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full"
        >15</span
      >
    </div>

    <!-- Profile Avatar -->
    <div
      class="w-8 h-8 rounded-full bg-gray-300 border border-gray-400 overflow-hidden cursor-pointer"
    >
      <img
        src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"
        alt="User"
        class="w-full h-full object-cover"
      />
    </div>
  </div>
</header>
