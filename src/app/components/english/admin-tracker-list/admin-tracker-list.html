<div class="p-4 md:p-8 max-w-7xl mx-auto font-sans">
  <h1 class="text-2xl font-bold mb-6 text-gray-800">
    User Daily Tracker Summary ({{ activeLanguage }})
  </h1>

  <!-- Filter & Search Controls Bar -->
  <div
    class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between"
  >
    <!-- Search Input -->
    <div class="w-full md:w-1/3">
      <label class="block text-xs font-semibold text-gray-500 mb-1">Search User</label>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="applyFilters()"
        placeholder="Search by Name or Phone..."
        class="w-full px-3.5 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
      />
    </div>

    <!-- Points Filter Range -->
    <div class="flex items-center gap-2 w-full md:w-1/2">
      <div class="w-1/2">
        <label class="block text-xs font-semibold text-gray-500 mb-1">Min Points</label>
        <input
          type="number"
          [(ngModel)]="minPoints"
          (input)="applyFilters()"
          placeholder="e.g. 100"
          class="w-full px-3.5 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
        />
      </div>

      <div class="w-1/2">
        <label class="block text-xs font-semibold text-gray-500 mb-1">Max Points</label>
        <input
          type="number"
          [(ngModel)]="maxPoints"
          (input)="applyFilters()"
          placeholder="e.g. 500"
          class="w-full px-3.5 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
        />
      </div>
    </div>

    <!-- Clear Filters Button -->
    <div class="w-full md:w-auto self-end">
      <button
        (click)="resetFilters()"
        class="w-full md:w-auto px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200 transition"
      >
        Reset
      </button>
    </div>
  </div>

  <!-- Users Table -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 uppercase text-xs">
            <th class="py-3.5 px-4 font-semibold">User Name</th>
            <!-- <th class="py-3.5 px-4 font-semibold">Phone / Email</th> -->
            <th class="py-3.5 px-4 font-semibold text-center">Completed Days</th>
            <th class="py-3.5 px-4 font-semibold text-center">Total Points</th>
            <th class="py-3.5 px-4 font-semibold text-center">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr *ngFor="let user of filteredUsers" class="hover:bg-gray-50/80 transition">
            <!-- Clickable Name Column -->
            <td class="py-3.5 px-4">
              <button
                (click)="navigateToUserTracker(user._id, user.name)"
                class="font-semibold text-emerald-600 hover:text-emerald-800 hover:underline text-left"
              >
                {{ user.name }}
              </button>
            </td>

            <!-- <td class="py-3.5 px-4 text-gray-600">
              <div>{{ user.phone || 'N/A' }}</div>
              <div class="text-xs text-gray-400">{{ user.email }}</div>
            </td> -->

            <td class="py-3.5 px-4 text-center font-medium text-gray-700">
              {{ user.totalCompletedDays }} Days
            </td>

            <td class="py-3.5 px-4 text-center">
              <span class="px-2.5 py-1 text-xs font-bold text-white bg-emerald-500 rounded-full">
                {{ user.points }}
              </span>
            </td>

            <td class="py-3.5 px-4 text-center">
              <button
                (click)="navigateToUserTracker(user._id, user.name)"
                class="px-3 py-1.5 bg-emerald-50 text-emerald-700 font-medium rounded-md hover:bg-emerald-100 text-xs transition"
              >
                View Tracker →
              </button>
            </td>
          </tr>

          <!-- No Data State -->
          <tr *ngIf="filteredUsers.length === 0">
            <td colspan="5" class="py-8 text-center text-gray-400">No matching users found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
