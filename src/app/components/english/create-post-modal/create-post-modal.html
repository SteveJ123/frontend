<!-- 3-Dots Menu -->
  <div *ngIf="post.username === username || !post.username" class="relative group">
    <button class="p-1 rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-100">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z" />
      </svg>
    </button>
    <div class="hidden group-hover:block absolute right-0 w-28 bg-white border border-gray-100 rounded-xl shadow-lg z-10 py-1">
      <button (click)="startEditing(post)" class="w-full text-left px-4 py-1.5 text-xs font-semibold text-gray-700 hover:bg-gray-50">Edit</button>
      <button (click)="deletePost(post._id)" class="w-full text-left px-4 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50">Delete</button>
    </div>
  </div>


<!-- ================= POST CONTENT & EDIT DISPLAY ================= -->
<div class="px-3 pt-3">
  <!-- Standard View -->
  <div *ngIf="editingPostId !== post._id" class="whitespace-pre-line break-words text-sm leading-7 text-gray-700">
    {{ post.content }}
  </div>

  <!-- Edit Text Input -->
  <div *ngIf="editingPostId === post._id" class="space-y-3">
    <textarea
      rows="3"
      [(ngModel)]="editContent"
      class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none focus:border-blue-500"
    ></textarea>
  </div>
</div>

<!-- ================= MEDIA SECTION ================= -->
<!-- READ ONLY MEDIA -->
<div *ngIf="editingPostId !== post._id && post.mediaFiles?.length" class="mt-3 w-full bg-gray-100">
  <ng-container *ngFor="let media of post.mediaFiles">
    <img *ngIf="media.mediaType === 'image'" [src]="getMediaUrl(media.path)" class="block max-h-[650px] w-full object-cover" />
    <video *ngIf="media.mediaType === 'video'" controls class="block max-h-[650px] w-full">
      <source [src]="getMediaUrl(media.path)" [type]="media.mimetype" />
    </video>
    <audio *ngIf="media.mediaType === 'audio'" controls class="w-full p-2">
      <source [src]="getMediaUrl(media.path)" [type]="media.mimetype" />
    </audio>
  </ng-container>
</div>

<!-- EDIT MODE MEDIA MANAGEMENT -->
<div *ngIf="editingPostId === post._id" class="p-3 bg-gray-50 border-t border-gray-200 space-y-3">
  <span class="text-xs font-bold text-gray-600">Manage Media Files</span>

  <!-- 1. Existing Saved Media Attachments -->
  <div class="flex flex-wrap gap-3">
    <ng-container *ngFor="let media of post.mediaFiles">
      <div *ngIf="!isMediaRemoved(media._id)" class="relative group rounded-xl overflow-hidden border border-gray-300 w-24 h-24 bg-black/5">
        <img *ngIf="media.mediaType === 'image'" [src]="getMediaUrl(media.path)" class="w-full h-full object-cover" />
        <video *ngIf="media.mediaType === 'video'" [src]="getMediaUrl(media.path)" class="w-full h-full object-cover"></video>
        <div *ngIf="media.mediaType === 'audio'" class="w-full h-full flex items-center justify-center text-xs text-gray-600 font-bold p-1 text-center">Audio</div>

        <button
          (click)="markMediaForRemoval(media._id)"
          class="absolute top-1 right-1 w-6 h-6 bg-red-600 text-white rounded-full flex items-center justify-center text-xs font-bold shadow hover:bg-red-700 transition"
        >
          ✕
        </button>
      </div>
    </ng-container>
  </div>

  <!-- 2. Newly Added Pending Files -->
  <div *ngIf="newEditFiles.length > 0" class="flex flex-wrap gap-2 pt-1">
    <div *ngFor="let item of newEditFiles; let i = index" class="relative rounded-xl overflow-hidden border border-blue-300 w-20 h-20 bg-blue-50">
      <img *ngIf="item.type === 'image'" [src]="item.previewUrl" class="w-full h-full object-cover" />
      <video *ngIf="item.type === 'video'" [src]="item.previewUrl" class="w-full h-full object-cover"></video>
      <div *ngIf="item.type === 'audio'" class="w-full h-full flex items-center justify-center text-xs text-blue-800 font-bold p-1">Audio</div>
      
      <button (click)="removeNewEditFile(i)" class="absolute top-1 right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs font-bold">✕</button>
    </div>
  </div>

  <!-- 3. Actions & File Pickers -->
  <div class="flex items-center justify-between pt-2 border-t border-gray-200">
    <div class="flex gap-2">
      <input #editImgInput type="file" accept="image/*" (change)="onEditFileSelected($event, 'image')" class="hidden" />
      <input #editVidInput type="file" accept="video/*" (change)="onEditFileSelected($event, 'video')" class="hidden" />
      <input #editAudInput type="file" accept="audio/*" (change)="onEditFileSelected($event, 'audio')" class="hidden" />

      <button (click)="editImgInput.click()" class="text-xs bg-gray-200 hover:bg-gray-300 px-2.5 py-1.5 rounded-lg font-medium">📷 +Image</button>
      <button (click)="editVidInput.click()" class="text-xs bg-gray-200 hover:bg-gray-300 px-2.5 py-1.5 rounded-lg font-medium">🎥 +Video</button>
      <button (click)="editAudInput.click()" class="text-xs bg-gray-200 hover:bg-gray-300 px-2.5 py-1.5 rounded-lg font-medium">🎙️ +Audio</button>
    </div>

    <div class="flex items-center gap-2">
      <button (click)="cancelEditing()" class="text-xs px-3 py-1.5 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100">Cancel</button>
      <button (click)="saveEdit(post)" class="text-xs px-3 py-1.5 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700">Save Changes</button>
    </div>
  </div>
</div>
