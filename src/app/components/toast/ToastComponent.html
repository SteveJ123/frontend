<div class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  <div
    *ngFor="let toast of toasts$ | async"
    class="pointer-events-auto flex items-center justify-between p-4 rounded-xl shadow-lg border transition-all duration-300 animate-slide-in"
    [ngClass]="{
      'bg-emerald-50 border-emerald-200 text-emerald-800': toast.type === 'success',
      'bg-rose-50 border-rose-200 text-rose-800': toast.type === 'error',
      'bg-amber-50 border-amber-200 text-amber-800': toast.type === 'warning',
      'bg-blue-50 border-blue-200 text-blue-800': toast.type === 'info',
    }"
  >
    <div class="flex items-center gap-3">
      <!-- Success Icon -->
      <svg
        *ngIf="toast.type === 'success'"
        class="w-5 h-5 text-emerald-600 shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>

      <!-- Error Icon -->
      <svg
        *ngIf="toast.type === 'error'"
        class="w-5 h-5 text-rose-600 shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>

      <!-- Warning Icon -->
      <svg
        *ngIf="toast.type === 'warning'"
        class="w-5 h-5 text-amber-600 shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>

      <!-- Info Icon -->
      <svg
        *ngIf="toast.type === 'info'"
        class="w-5 h-5 text-blue-600 shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>

      <span class="text-xs font-semibold leading-snug">{{ toast.message }}</span>
    </div>

    <!-- Dismiss Button -->
    <button
      (click)="dismiss(toast.id)"
      class="ml-4 p-1 rounded-lg hover:bg-black/5 transition-colors shrink-0"
    >
      <svg
        class="w-4 h-4 opacity-60 hover:opacity-100"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>
</div>
