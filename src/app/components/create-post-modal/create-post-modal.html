<!-- Trigger Button Section -->
<div class="flex items-center space-x-3 p-4">
  <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center overflow-hidden">
    <svg class="w-8 h-8 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
      <path
        fill-rule="evenodd"
        d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
        clip-rule="evenodd"
      />
    </svg>
  </div>
  <div>
    <h3 class="font-bold text-gray-900 text-sm">Legala Manjula</h3>
    <!-- Trigger Button -->
    <button
      (click)="openMembershipModal()"
      class="mt-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium text-xs px-2.5 py-1 rounded-md flex items-center space-x-1.5 transition"
    >
      <span>+ membership</span>
      <svg class="w-3.5 h-3.5 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
        <path
          fill-rule="evenodd"
          d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>
</div>

<!-- Membership Modal Backdrop -->
<div
  *ngIf="isMembershipModalOpen()"
  (click)="closeMembershipModal()"
  class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4"
>
  <!-- Modal Dialog Window -->
  <div
    (click)="$event.stopPropagation()"
    class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[85vh] border border-gray-100"
  >
    <!-- Header -->
    <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
      <button
        (click)="closeMembershipModal()"
        class="w-8 h-8 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-600 transition"
      >
        ←
      </button>
      <h2 class="text-base font-bold text-gray-900">Select membership</h2>
      <button
        (click)="closeMembershipModal()"
        class="w-8 h-8 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-600 transition"
      >
        ✕
      </button>
    </div>

    <!-- Subheader Text & Search Bar -->
    <div class="px-5 pt-4 pb-2 space-y-3">
      <div>
        <h3 class="text-sm font-semibold text-gray-800">Who can see your post?</h3>
        <p class="text-xs text-gray-400">Your post will appear in community feed.</p>
      </div>

      <!-- Search Input -->
      <div class="relative">
        <svg
          class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search membership by name"
          class="w-full pl-9 pr-3 py-2 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-gray-400 text-gray-700 placeholder-gray-400"
        />
      </div>

      <!-- Select All -->
      <div class="flex items-center space-x-2 pt-1">
        <input
          type="checkbox"
          id="selectAllMemberships"
          [checked]="isAllMembershipsSelected()"
          (change)="toggleSelectAllMemberships($event)"
          class="w-4 h-4 rounded border-gray-300 text-green-600 focus:ring-green-500 cursor-pointer"
        />
        <label
          for="selectAllMemberships"
          class="text-xs font-medium text-gray-600 cursor-pointer select-none"
        >
          Select All
        </label>
      </div>
    </div>

    <!-- Scrollable Membership List -->
    <div class="p-5 overflow-y-auto space-y-3 flex-1 max-h-[350px]">
      <div
        *ngFor="let item of filteredMemberships()"
        (click)="toggleMembership(item)"
        class="border border-gray-200 hover:border-gray-300 rounded-xl p-3 flex items-center justify-between cursor-pointer transition bg-white select-none"
      >
        <div class="space-y-1.5">
          <p class="text-xs font-semibold text-gray-800">{{ item.name }}</p>
          <div class="flex items-center space-x-1.5">
            <span
              class="bg-green-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-md tracking-wider uppercase"
              >ACTIVE</span
            >
            <span
              class="bg-green-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-md tracking-wider uppercase"
              >ONETIME</span
            >
          </div>
        </div>

        <input
          type="checkbox"
          [checked]="item.selected"
          (click)="$event.stopPropagation()"
          (change)="toggleMembership(item)"
          class="w-4 h-4 rounded border-gray-300 text-green-600 focus:ring-green-500 cursor-pointer"
        />
      </div>
    </div>

    <!-- Footer -->
    <div class="p-4 border-t border-gray-100 flex justify-end bg-white">
      <button
        (click)="saveMembershipChanges()"
        class="bg-gray-400 hover:bg-gray-500 text-white font-bold text-xs px-6 py-2.5 rounded-xl transition shadow-sm"
      >
        Save changes
      </button>
    </div>
  </div>
</div>
